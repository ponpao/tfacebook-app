name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      # prepare:chromium (invoked in the build step below) stages Chromium
      # from the local Playwright cache into resources/ms-playwright for
      # electron-builder to ship as an extraResource — that cache is empty
      # on a fresh runner, so it has to be populated here first or the build
      # fails at that step with "Playwright cache not found".
      - name: Install Playwright Chromium
        run: npx playwright install chromium

      # electron-builder.json5 has a publish:{provider:'github',...} block,
      # and electron-builder implicitly triggers a publish attempt just from
      # detecting a v* git tag in CI — regardless of whether --publish was
      # passed (build:win doesn't) and regardless of GH_TOKEN being present.
      # Without a token that implicit attempt hard-fails the whole build
      # ("GitHub Personal Access Token is not set"); with one (as in an
      # earlier version of this workflow), it races against the separate
      # "Publish GitHub Release" step below and both try to create/update
      # the same release, so one fails with "already_exists". `--publish
      # never` explicitly overrides the implicit tag-triggered publish so
      # electron-builder only ever produces local files in dist/ —
      # softprops/action-gh-release below is this workflow's single,
      # explicit publisher.
      - name: Build Electron App for Windows
        run: npm run build && npm run prepare:chromium && npx electron-builder --win --x64 --publish never

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
