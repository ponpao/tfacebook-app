name: Release Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      # prepare:chromium (invoked by build:win below) stages Chromium from
      # the local Playwright cache into resources/ms-playwright for
      # electron-builder to ship as an extraResource — that cache is empty
      # on a fresh runner, so it has to be populated here first or the build
      # fails at that step with "Playwright cache not found".
      - name: Install Playwright Chromium
        run: npx playwright install chromium

      # Deliberately no GH_TOKEN here even though build:win never passes
      # --publish: electron-builder.json5 has a publish:{provider:'github',...}
      # block, and electron-builder auto-detects + publishes to that provider
      # whenever a GitHub token is present in its environment regardless of
      # --publish. With GH_TOKEN set here, electron-builder created its own
      # GitHub Release for this tag at the same time the separate "Publish
      # GitHub Release" step below tried to, and the two raced — one created
      # the release, the other then failed with "already_exists" trying to
      # create/update the same tag_name. softprops/action-gh-release below is
      # the single, explicit publisher for this workflow.
      - name: Build Electron App for Windows
        run: npm run build:win

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
